<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Patchbay · Estudio A</title>
<style>
/* layout: sticky header with mode tabs; scrollable list of 6 section panels, each a 48-column grid shared by SUP+INF so both rows stay aligned; a page-level SVG overlay draws real cable curves between connected jacks; side panel for the connection list / exercises */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#1c1b18; --muted:#6b6660; --line:#ddd7cc;
  --accent:#c4542f; --accent-ink:#ffffff;
  --c-mic:#3f7cc4; --c-preamp:#c4473f; --c-send:#c49a2f; --c-return:#3f9d5f; --c-dawsend:#c4762f; --c-neutral:#8d9199; --c-outboard:#8a5fc4; --c-unconf:#aaa39a;
  --good:#2f9e5a; --bad:#c43f3f;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140f; --panel:#201f19; --ink:#f1ede4; --muted:#a39d91; --line:#36332b;
    --accent:#e07a4e; --accent-ink:#1c1200;
    --c-mic:#6fa3e0; --c-preamp:#e0766f; --c-send:#e0bd5f; --c-return:#6fcf8f; --c-dawsend:#e0a267; --c-neutral:#9ba0a8; --c-outboard:#b393e0; --c-unconf:#6b665c;
    --good:#5fcf8a; --bad:#e07a74;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15140f; --panel:#201f19; --ink:#f1ede4; --muted:#a39d91; --line:#36332b;
  --accent:#e07a4e; --accent-ink:#1c1200;
  --c-mic:#6fa3e0; --c-preamp:#e0766f; --c-send:#e0bd5f; --c-return:#6fcf8f; --c-dawsend:#e0a267; --c-neutral:#9ba0a8; --c-outboard:#b393e0; --c-unconf:#6b665c;
  --good:#5fcf8a; --bad:#e07a74;
  color-scheme: dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);min-height:100%}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.wrap{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:14px 90px;max-width:1400px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.topRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.title{display:flex;flex-direction:column;gap:2px}
.title h1{font-size:1.15rem}
.title small{color:var(--muted);font-size:.72rem}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{appearance:none;border:none;background:transparent;color:var(--muted);font-family:var(--font-body);font-weight:600;font-size:.82rem;padding:7px 14px;border-radius:999px;cursor:pointer}
.tab.active{background:var(--accent);color:var(--accent-ink)}
.ghost-btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--font-body);font-size:.78rem;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.ghost-btn:hover{border-color:var(--accent)}

.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0 4px;font-size:.72rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend i.unconf{background:repeating-linear-gradient(45deg,var(--c-unconf),var(--c-unconf) 2px,transparent 2px,transparent 4px)}

.note{font-size:.74rem;color:var(--muted);line-height:1.5;background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}

details.patch{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;position:relative;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 96px);width:max-content;min-width:100%}
details.patch > summary{list-style:none;cursor:pointer;padding:10px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--panel) 92%, var(--ink) 8%);display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;left:0;z-index:7}
details.patch > summary::-webkit-details-marker{display:none}
details.patch > summary h2{font-size:.92rem}
details.patch > summary::after{content:'▸';color:var(--muted);font-size:.8rem;flex:none;transition:transform .15s}
details.patch[open] > summary::after{transform:rotate(90deg)}
@media(prefers-reduced-motion:reduce){details.patch > summary::after{transition:none}}
.rowScroll{padding:12px 14px}
.secGrid{display:grid;grid-template-columns:30px repeat(48, 34px);grid-template-rows:auto 50px auto 50px;column-gap:3px;row-gap:4px;width:max-content}
.rowTag{position:sticky;left:0;background:var(--panel);z-index:2;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.06em;color:var(--muted)}
.groupHead{font-size:.58rem;color:var(--muted);white-space:nowrap;font-weight:600;align-self:end;padding-bottom:2px;overflow:hidden}
.groupHead.inf{align-self:start;padding-bottom:0;padding-top:2px}
.groupHead .unconfTag{color:var(--c-unconf);font-style:italic}
.jack{appearance:none;cursor:pointer;border:none;background:transparent;width:34px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;position:relative}
.jack .hole{width:24px;height:24px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--bg) 70%, #fff 30%) 0%, color-mix(in srgb, var(--ink) 12%, var(--bg)) 55%, color-mix(in srgb, var(--ink) 28%, var(--bg)) 100%);border:2.5px solid var(--cat,var(--c-neutral));box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.jack .cap{font-family:var(--font-mono);font-size:.54rem;color:var(--muted);text-align:center;line-height:1.1;white-space:nowrap;max-width:36px;overflow:hidden;text-overflow:ellipsis}
.jack.unconfirmed .hole{background:repeating-linear-gradient(45deg, color-mix(in srgb, var(--panel) 75%, var(--c-unconf) 25%), color-mix(in srgb, var(--panel) 75%, var(--c-unconf) 25%) 2px, var(--panel) 2px, var(--panel) 4px);border-style:dashed;border-color:var(--c-unconf)}
.jack:hover .hole{border-color:var(--accent)}
.jack.pending .hole{outline:2px solid var(--accent);outline-offset:2px}

.cableLayer{position:absolute;top:0;left:0;pointer-events:none;z-index:9}
.cableLayer .hit{pointer-events:stroke;cursor:pointer}
.cableLayer .shadow{stroke:rgba(0,0,0,.35);stroke-width:7;stroke-linecap:round;fill:none;opacity:.5;transition:opacity .12s ease}
.cableLayer .vis{stroke-width:5.5;stroke-linecap:round;opacity:.95;fill:none;transition:stroke-width .12s ease,opacity .12s ease}
.cableLayer .core{stroke:rgba(255,255,255,.4);stroke-width:1.4;stroke-linecap:round;fill:none;opacity:.5;transition:opacity .12s ease}
.cableLayer .cableG.active .vis{stroke-width:7.5;opacity:1}
.cableLayer .cableG.active .core{opacity:.75}
.cableLayer .cableG.dim .vis,.cableLayer .cableG.dim .shadow,.cableLayer .cableG.dim .core{opacity:.08}
@media(prefers-reduced-motion:reduce){.cableLayer .vis,.cableLayer .shadow,.cableLayer .core{transition:none}}

.panels{display:grid;grid-template-columns:1fr;gap:16px}
#sections{order:2;overflow-x:auto;position:relative}
.sidebar{order:1;display:flex;flex-direction:column;gap:12px}
@media(max-width:640px){
  .secGrid{grid-template-columns:34px repeat(48, 40px);grid-template-rows:auto 56px auto 56px}
  .jack{width:40px;height:56px}
  .jack .hole{width:28px;height:28px}
  .jack .cap{max-width:40px;font-size:.58rem}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h3{font-size:.85rem;margin-bottom:8px}
.cableList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.cableList li{display:flex;align-items:center;gap:8px;font-size:.72rem;border-left:4px solid var(--wire,var(--accent));background:var(--bg);border-radius:6px;padding:6px 8px}
.cableList li .desc{flex:1;min-width:0;line-height:1.3}
.cableList li button{appearance:none;border:none;background:transparent;color:var(--bad);font-size:.9rem;cursor:pointer;padding:2px 4px;flex:none}
.empty{color:var(--muted);font-size:.74rem;font-style:italic}

.exList{display:flex;flex-direction:column;gap:8px}
.exCard{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
.exCard.active{border-color:var(--accent)}
.exCard h4{font-size:.78rem;margin-bottom:2px}
.exCard p{font-size:.68rem;color:var(--muted);margin:0}
.badge{font-size:.62rem;font-weight:700;padding:1px 7px;border-radius:999px;display:inline-block;margin-left:6px}
.badge.ok{background:color-mix(in srgb, var(--good) 20%, transparent);color:var(--good)}
.badge.pending{background:color-mix(in srgb, var(--muted) 20%, transparent);color:var(--muted)}

.exWork{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.7rem}
.checklist li{display:flex;gap:6px;align-items:flex-start}
.checklist li .mark{flex:none;font-weight:800}
.checklist li.met .mark{color:var(--good)}
.checklist li.unmet .mark{color:var(--bad)}
.btnRow{display:flex;gap:8px;flex-wrap:wrap}
.btnRow button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:.74rem;font-weight:600;padding:7px 11px;border-radius:8px;cursor:pointer}
.btnRow button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-size:.78rem;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top"><div class="wrap" style="padding-block:0">
  <div class="topRow">
    <div class="title">
      <h1>Patchbay · Estudio A</h1>
      <small>Reconstrucción fotográfica del patchbay — sin verificación eléctrica — Rev. 04</small>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="tabs">
        <button class="tab active" data-mode="sandbox">Sandbox</button>
        <button class="tab" data-mode="exercise">Ejercicios</button>
      </div>
      <button class="ghost-btn" id="expandAllBtn">Expandir todo</button>
      <button class="ghost-btn" id="clearBtn">Limpiar cables</button>
    </div>
  </div>
  <div class="legend" id="legend"></div>
</div></header>

<div class="wrap">
  <div class="panels">
    <div id="sections"><svg id="cableSvg" class="cableLayer" width="0" height="0"><defs>
      <radialGradient id="plugMetal" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#eef0f3"/>
        <stop offset="55%" stop-color="#9a9ca3"/>
        <stop offset="100%" stop-color="#53555c"/>
      </radialGradient>
    </defs></svg></div>
    <aside class="sidebar">
      <div class="card" id="sandboxCard">
        <h3>Cables activos (sandbox)</h3>
        <ul class="cableList" id="sandboxList"></ul>
      </div>
      <div class="card" id="exerciseListCard" hidden>
        <h3>Ejercicios</h3>
        <div class="exList" id="exList"></div>
      </div>
      <div class="card" id="exerciseWorkCard" hidden>
        <h3 id="exTitle">Ejercicio</h3>
        <p style="font-size:.74rem;color:var(--muted);margin:0 0 8px" id="exDesc"></p>
        <ul class="cableList" id="exCableList"></ul>
        <div class="exWork">
          <ul class="checklist" id="exChecklist"></ul>
          <div class="btnRow">
            <button class="primary" id="verifyBtn">Verificar</button>
            <button id="hintBtn">Pista</button>
            <button id="resetExBtn">Reiniciar</button>
            <button id="backToListBtn">← Lista</button>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>

<div id="toast"></div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">

  {label:'Tascam HD1000', cat:'outboard', items:['L In','R In']},
  {label:'GML Stereo EQ', cat:'outboard', items:['L In','R In']},
  {label:'Distressor', cat:'outboard', items:['1 In','2 In']},
  {label:'76 KT', cat:'outboard', items:['In']},
  {label:'KT 2A', cat:'outboard', items:['In']},
  {label:'Sin confirmar', cat:'unconfirmed', items:seq(25,40), confirmed:false},
  {label:'Mic Lines (adicional)', cat:'mic', items:['41','42','43'], confirmed:false},
  {label:'Etiqueta huérfana', cat:'unconfirmed', items:['4 In'], confirmed:false},
  {label:'Sin confirmar', cat:'unconfirmed', items:seq(45,48), confirmed:false},
]},
];

const JACKS = {}; // key: section|row|pos -> jack data
function key(s,r,p){return s+'|'+r+'|'+p;}

function buildAndRenderSections(){
  const host = document.getElementById('sections');
  SECTIONS.forEach(sec=>{
    const el = document.createElement('details');
    el.className='patch';
    el.id = 'sec-'+sec.id;
    el.open = true;
    el.addEventListener('toggle', scheduleRedraw);
    const sum = document.createElement('summary');
    sum.innerHTML = `<h2>${sec.title}</h2>`;
    el.appendChild(sum);
    el.appendChild(renderSectionGrid(sec));
    host.appendChild(el);
  });
}

function setSectionsOpen(idsOrAll){
  document.querySelectorAll('details.patch').forEach(d=>{
    d.open = (idsOrAll==='all') ? true : idsOrAll.has(d.id.replace('sec-',''));
  });
  scheduleRedraw();
}

function renderSectionGrid(sec){
  const wrap=document.createElement('div');
  wrap.className='rowScroll';
  const grid=document.createElement('div');
  grid.className='secGrid';

  const supTag=document.createElement('div'); supTag.className='rowTag';
  supTag.style.gridColumn='1'; supTag.style.gridRow='1 / 3'; supTag.textContent='SUP';
  const infTag=document.createElement('div'); infTag.className='rowTag';
  infTag.style.gridColumn='1'; infTag.style.gridRow='3 / 5'; infTag.textContent='INF';
  grid.appendChild(supTag); grid.appendChild(infTag);

  renderGridRow(grid, sec, 'sup', 1, 2, false);
  renderGridRow(grid, sec, 'inf', 3, 4, true);

  wrap.appendChild(grid);
  return wrap;
}

function renderGridRow(grid, sec, rowKey, headerRow, jackRow, headerAfter){
  let pos=1;
  sec[rowKey].forEach(group=>{
    const confirmed = group.confirmed!==false && group.cat!=='unconfirmed';
    const start = pos;
    const head=document.createElement('div');
    head.className='groupHead'+(headerAfter?' inf':'');
    head.style.gridColumn = `${start+1} / ${start+1+group.items.length}`;
    head.style.gridRow = String(headerRow);
    head.innerHTML = `${group.label}${confirmed?'':' <span class="unconfTag">· sin confirmar</span>'}`;
    grid.appendChild(head);

    group.items.forEach(item=>{
      const p = pos++;
      const jackConfirmed = group.confirmed!==false;
      const data={section:sec.id, sectionTitle:sec.title, row:rowKey, pos:p, item, group:group.label, cat:group.cat, confirmed:jackConfirmed};
      JACKS[key(sec.id,rowKey,p)] = data;
      const b=document.createElement('button');
      b.className='jack'+(group.cat==='unconfirmed'||!jackConfirmed?' unconfirmed':'');
      b.style.setProperty('--cat', `var(${CATS[group.cat].v})`);
      b.style.gridColumn = String(p+1);
      b.style.gridRow = String(jackRow);
      b.dataset.section=sec.id; b.dataset.row=rowKey; b.dataset.pos=p;
      b.title = `Sección ${sec.title} · ${rowKey.toUpperCase()} ${p} — ${group.label} ${item}` + (jackConfirmed?'':' (sin confirmar)');
      const holeSpan = `<span class="hole"></span>`;
      const capSpan = `<span class="cap">${item}</span>`;
      b.innerHTML = headerAfter ? (holeSpan+capSpan) : (capSpan+holeSpan);
      b.addEventListener('click', onJackClick);
      b.addEventListener('mouseenter', ()=>{ hoverJackKey = key(sec.id,rowKey,p); scheduleRedraw(); });
      b.addEventListener('mouseleave', ()=>{ if(hoverJackKey===key(sec.id,rowKey,p)){ hoverJackKey=null; scheduleRedraw(); } });
      grid.appendChild(b);
    });
  });
}

// ---- Legend ----
function renderLegend(){
  const host=document.getElementById('legend');
  host.innerHTML = Object.entries(CATS).map(([k,c])=>
    `<span><i class="${k==='unconfirmed'?'unconf':''}" style="${k==='unconfirmed'?'':`background:var(${c.v})`}"></i>${c.label}</span>`
  ).join('');
}

// ---- State ----
let mode='sandbox';
let pending=null;
let hoverJackKey=null;
let sandboxCables = loadSandbox();
let exerciseCables = [];
let currentExercise = null;
const WIRE_COLORS = ['#c4542f','#3f7cc4','#3f9d5f','#8a5fc4','#c49a2f','#c4473f','#2f9ea0','#9e7a2f'];
let wireIdx = 0;

function loadSandbox(){
  try{ const raw = localStorage.getItem('patchbay_sandbox_v1'); return raw? JSON.parse(raw): []; }catch(e){ return []; }
}
function saveSandbox(){
  try{ localStorage.setItem('patchbay_sandbox_v1', JSON.stringify(sandboxCables)); }catch(e){}
}

function cables(){ return mode==='sandbox' ? sandboxCables : exerciseCables; }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('show'), 2200);
}

function sameJack(a,b){ return a.section===b.section && a.row===b.row && a.pos===b.pos; }

function jackEl(j){
  return document.querySelector(`.jack[data-section="${j.section}"][data-row="${j.row}"][data-pos="${j.pos}"]`);
}

function describeJack(j){
  const d=JACKS[key(j.section,j.row,j.pos)];
  return `Sec ${d.section} · ${d.row.toUpperCase()} ${d.pos} — ${d.group} ${d.item}`;
}

function onJackClick(e){
  const b=e.currentTarget;
  const j={section:b.dataset.section, row:b.dataset.row, pos:Number(b.dataset.pos)};
  if(!pending){
    pending=j; b.classList.add('pending');
    return;
  }
  if(sameJack(pending,j)){
    jackEl(pending).classList.remove('pending'); pending=null; return;
  }
  if(pending.row===j.row){
    jackEl(pending).classList.remove('pending');
    pending=j; b.classList.add('pending');
    return;
  }
  const supJack = pending.row==='sup'? pending : j;
  const infJack = pending.row==='inf'? pending : j;
  const occupied = cables().some(c => sameJack(c.inf, infJack));
  if(occupied){
    toast('Ese destino ya tiene un cable. Quítalo primero.');
    jackEl(pending).classList.remove('pending'); pending=null;
    return;
  }
  const color = WIRE_COLORS[wireIdx++ % WIRE_COLORS.length];
  cables().push({id:Date.now()+'-'+Math.random().toString(36).slice(2), sup:supJack, inf:infJack, color});
  jackEl(pending).classList.remove('pending'); pending=null;
  if(mode==='sandbox') saveSandbox();
  renderAll();
}

function removeCable(id){
  const arr = cables();
  const idx = arr.findIndex(c=>c.id===id);
  if(idx>-1) arr.splice(idx,1);
  if(mode==='sandbox') saveSandbox();
  renderAll();
}

// ---- Cable rendering ----
// Every cable is drawn on ONE overlay that lives inside #sections — the
// single shared horizontally-scrolling box that holds every section's grid.
// Coordinates are "content-space" (the section's own scrollLeft is added
// back in), and since the overlay is a plain child of that same scrolling
// box, the browser scrolls it together with every jack natively. No JS runs
// on scroll at all, so a cable can never visually lag behind a touch-scroll
// gesture, whether both its ends are in one section or in different ones.
const cableEls = new Map(); // cable id -> els

function buildCableGroupEls(svg, onRemove){
  const g = document.createElementNS(SVG_NS,'g');
  const shadow = document.createElementNS(SVG_NS,'path');
  shadow.setAttribute('class','shadow'); shadow.setAttribute('fill','none'); shadow.setAttribute('transform','translate(0,2)');
  const vis = document.createElementNS(SVG_NS,'path');
  vis.setAttribute('class','vis'); vis.setAttribute('fill','none');
  const core = document.createElementNS(SVG_NS,'path');
  core.setAttribute('class','core'); core.setAttribute('fill','none');
  const hit = document.createElementNS(SVG_NS,'path');
  hit.setAttribute('class','hit'); hit.setAttribute('stroke','transparent'); hit.setAttribute('stroke-width','18'); hit.setAttribute('fill','none');
  hit.addEventListener('click', onRemove);
  const capAOuter = document.createElementNS(SVG_NS,'circle');
  capAOuter.setAttribute('stroke','var(--panel)'); capAOuter.setAttribute('stroke-width','1.5');
  const capAInner = document.createElementNS(SVG_NS,'circle');
  capAInner.setAttribute('fill','url(#plugMetal)'); capAInner.setAttribute('stroke','rgba(0,0,0,.4)'); capAInner.setAttribute('stroke-width','.5');
  const capBOuter = document.createElementNS(SVG_NS,'circle');
  capBOuter.setAttribute('stroke','var(--panel)'); capBOuter.setAttribute('stroke-width','1.5');
  const capBInner = document.createElementNS(SVG_NS,'circle');
  capBInner.setAttribute('fill','url(#plugMetal)'); capBInner.setAttribute('stroke','rgba(0,0,0,.4)'); capBInner.setAttribute('stroke-width','.5');
  g.appendChild(shadow); g.appendChild(vis); g.appendChild(core); g.appendChild(hit);
  g.appendChild(capAOuter); g.appendChild(capAInner); g.appendChild(capBOuter); g.appendChild(capBInner);
  svg.appendChild(g);
  return {g,shadow,vis,core,hit,capAOuter,capAInner,capBOuter,capBInner};
}

function applyCableGeometry(els, x1,y1,x2,y2, capRA,capRB, color, isActive, dim){
  const ctrl = Math.max(30, Math.min(260, Math.abs(y2-y1)/2 + 20));
  const d = `M ${x1} ${y1} C ${x1} ${y1+ctrl}, ${x2} ${y2-ctrl}, ${x2} ${y2}`;
  els.g.style.display='';
  els.g.setAttribute('class','cableG'+(isActive?' active':'')+(dim?' dim':''));
  els.shadow.setAttribute('d', d);
  els.vis.setAttribute('d', d); els.vis.setAttribute('stroke', color);
  els.core.setAttribute('d', d);
  els.hit.setAttribute('d', d);
  els.capAOuter.setAttribute('cx', x1); els.capAOuter.setAttribute('cy', y1); els.capAOuter.setAttribute('r', capRA); els.capAOuter.setAttribute('fill', color);
  els.capAInner.setAttribute('cx', x1); els.capAInner.setAttribute('cy', y1); els.capAInner.setAttribute('r', capRA*0.45);
  els.capBOuter.setAttribute('cx', x2); els.capBOuter.setAttribute('cy', y2); els.capBOuter.setAttribute('r', capRB); els.capBOuter.setAttribute('fill', color);
  els.capBInner.setAttribute('cx', x2); els.capBInner.setAttribute('cy', y2); els.capBInner.setAttribute('r', capRB*0.45);
}

function isActiveCable(c){
  return !!(hoverJackKey && (key(c.sup.section,c.sup.row,c.sup.pos)===hoverJackKey || key(c.inf.section,c.inf.row,c.inf.pos)===hoverJackKey));
}

function contentAnchor(jackBtn){
  const hole = jackBtn.querySelector('.hole') || jackBtn;
  const hr = hole.getBoundingClientRect();
  if(hr.width===0) return null; // inside a collapsed section
  const sectionsEl = document.getElementById('sections');
  const cr = sectionsEl.getBoundingClientRect();
  return {
    x: hr.left - cr.left + sectionsEl.scrollLeft + hr.width/2,
    y: hr.top - cr.top + sectionsEl.scrollTop + hr.height/2,
    rad: Math.max(hr.width, hr.height)/2 + 1.5
  };
}

function layoutCable(c){
  const elA = jackEl(c.sup), elB = jackEl(c.inf);
  let els = cableEls.get(c.id);
  if(!elA || !elB){ if(els){ els.g.remove(); cableEls.delete(c.id); } return; }
  const a = contentAnchor(elA), b = contentAnchor(elB);
  if(!a || !b){ if(els) els.g.style.display='none'; return; } // endpoint inside a collapsed section
  if(!els){ els = buildCableGroupEls(document.getElementById('cableSvg'), ()=>removeCable(c.id)); cableEls.set(c.id, els); }
  applyCableGeometry(els, a.x,a.y,b.x,b.y, a.rad,b.rad, c.color, isActiveCable(c), !!hoverJackKey && !isActiveCable(c));
}

function redrawCables(){
  const sectionsEl = document.getElementById('sections');
  const svg = document.getElementById('cableSvg');
  svg.setAttribute('width', sectionsEl.scrollWidth);
  svg.setAttribute('height', sectionsEl.scrollHeight);

  const arr = cables();
  const liveIds = new Set(arr.map(c=>c.id));
  arr.forEach(layoutCable);
  for(const [id, els] of cableEls){ if(!liveIds.has(id)){ els.g.remove(); cableEls.delete(id); } }
}

function scheduleRedraw(){ redrawCables(); }
window.addEventListener('resize', scheduleRedraw);

function renderCableList(){
  const listEl = mode==='sandbox' ? document.getElementById('sandboxList') : document.getElementById('exCableList');
  const arr = cables();
  if(arr.length===0){
    listEl.innerHTML = '<li class="empty" style="border:none;background:none;padding:2px 0">Sin cables todavía.</li>';
    return;
  }
  listEl.innerHTML = arr.map(c=>`
    <li style="--wire:${c.color}">
      <span class="desc">${describeJack(c.sup)} <br>→ ${describeJack(c.inf)}</span>
      <button data-id="${c.id}" title="Quitar cable">✕</button>
    </li>
  `).join('');
  listEl.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.addEventListener('click', ()=> removeCable(btn.dataset.id));
  });
}

function renderAll(){
  renderCableList();
  scheduleRedraw();
  if(mode==='exercise' && currentExercise) renderChecklist(false);
}

// ---- Mode switching ----
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    if(pending){ jackEl(pending)?.classList.remove('pending'); pending=null; }
    document.getElementById('sandboxCard').hidden = mode!=='sandbox';
    if(mode==='exercise'){
      if(currentExercise){
        document.getElementById('exerciseWorkCard').hidden=false;
        document.getElementById('exerciseListCard').hidden=true;
        setSectionsOpen(exerciseSectionIds(currentExercise));
      } else {
        document.getElementById('exerciseListCard').hidden=false;
        document.getElementById('exerciseWorkCard').hidden=true;
        setSectionsOpen('all');
      }
    } else {
      document.getElementById('exerciseListCard').hidden=true;
      document.getElementById('exerciseWorkCard').hidden=true;
      setSectionsOpen('all');
    }
    renderAll();
  });
});

document.getElementById('expandAllBtn').addEventListener('click', ()=> setSectionsOpen('all'));

document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(mode==='sandbox'){ sandboxCables.length=0; saveSandbox(); }
  else { exerciseCables.length=0; }
  if(pending){ jackEl(pending)?.classList.remove('pending'); pending=null; }
  renderAll();
});

// ---- Exercises ----
const EXERCISES = [
  {id:'ex1', title:'Compresión insertada (SSL G Comp)',
   desc:'Patchea el insert del canal 5 a través del SSL G Comp: el envío del canal hacia la entrada del compresor, y la salida del compresor de vuelta al retorno del canal.',
   req:[
     {a:{section:'03',row:'sup',pos:5}, b:{section:'05',row:'inf',pos:41}, label:'Channel Insert Send (A) 5 → SSL G Comp In L'},
     {a:{section:'05',row:'sup',pos:41}, b:{section:'03',row:'inf',pos:5}, label:'SSL G Comp Out L → Channel Insert Return (A) 5'},
   ]},
  {id:'ex2', title:'Reverb con el Lexicon',
   desc:'Envía el Aux 1 al Lexicon PCM96 y trae su retorno al insert del canal 10 para monitorearlo sumado en ese canal.',
   req:[
     {a:{section:'02',row:'sup',pos:17}, b:{section:'05',row:'inf',pos:25}, label:'Aux Out 1 → Lexicon PCM96 In L'},
     {a:{section:'05',row:'sup',pos:25}, b:{section:'03',row:'inf',pos:18}, label:'Lexicon PCM96 Out L → Channel Insert Return (A) 10'},
   ]},
  {id:'ex3', title:'Monitoreo de un canal del DAW',
   desc:'Rutea la salida del canal 3 del DAW hacia el Tape Monitor 3 para poder escucharlo por el monitor path.',
   req:[
     {a:{section:'04',row:'sup',pos:3}, b:{section:'05',row:'inf',pos:3}, label:'DAW Send 3 → Tape Monitor Send 3'},
   ]},
  {id:'ex4', title:'Preamp externo (API 512)',
   desc:'Usa el preamp API 512 en vez del preamp interno para el micrófono 3: manda la línea de micrófono 3 a la entrada del API 512, y su salida de vuelta a la entrada de preamp del canal 3. (Simplificación pedagógica: en la consola real convendría usar una entrada de línea).',
   req:[
     {a:{section:'01',row:'sup',pos:3}, b:{section:'05',row:'inf',pos:33}, label:'Studio Mic Line 3 → API 512 In 1'},
     {a:{section:'05',row:'sup',pos:33}, b:{section:'01',row:'inf',pos:3}, label:'API 512 Out 1 → Microphone Preamp Input 3'},
   ]},
  {id:'ex5', title:'Exportar un stem al Avid',
   desc:'Manda el envío del canal 8 del DAW directamente a la entrada 8 del Avid 16x16 para exportar ese canal como stem.',
   req:[
     {a:{section:'04',row:'sup',pos:8}, b:{section:'04',row:'inf',pos:8}, label:'DAW Send 8 → Avid 16x16 Input 08'},
   ]},
  {id:'ex6', title:'Mic a otra sala (Tie Line)',
   desc:'Lleva el micrófono 10 del Estudio A hacia la sala B usando la tie line 10.',
   req:[
     {a:{section:'01',row:'sup',pos:10}, b:{section:'06',row:'inf',pos:2}, label:'Studio Mic Line 10 → Tie Line Panel 10'},
   ]},
];

function renderExList(){
  const host=document.getElementById('exList');
  host.innerHTML = EXERCISES.map(ex=>`<div class="exCard" data-id="${ex.id}"><h4>${ex.title}</h4><p>${ex.desc}</p></div>`).join('');
  host.querySelectorAll('.exCard').forEach(card=>{
    card.addEventListener('click', ()=> openExercise(card.dataset.id));
  });
}

function exerciseSectionIds(ex){
  const ids = new Set();
  ex.req.forEach(r=>{ ids.add(r.a.section); ids.add(r.b.section); });
  return ids;
}

function openExercise(id){
  currentExercise = EXERCISES.find(e=>e.id===id);
  exerciseCables = [];
  if(pending){ jackEl(pending)?.classList.remove('pending'); pending=null; }
  document.getElementById('exerciseListCard').hidden=true;
  document.getElementById('exerciseWorkCard').hidden=false;
  document.getElementById('exTitle').textContent = currentExercise.title;
  document.getElementById('exDesc').textContent = currentExercise.desc;
  const ids = exerciseSectionIds(currentExercise);
  setSectionsOpen(ids);
  renderAll();
  renderChecklist(false);
  const firstSec = document.getElementById('sec-'+[...ids][0]);
  if(firstSec) requestAnimationFrame(()=> firstSec.scrollIntoView({behavior:'smooth', block:'start'}));
}

function pairEquals(req, c){
  const rm = (x,y)=> x.section===y.section && x.row===y.row && x.pos===y.pos;
  return rm(req.a,c.sup) && rm(req.b,c.inf);
}

function renderChecklist(evaluate){
  const ul = document.getElementById('exChecklist');
  const rows = currentExercise.req.map(req=>{
    const met = exerciseCables.some(c=> pairEquals(req,c));
    return {req, met};
  });
  ul.innerHTML = rows.map(r=>`<li class="${evaluate ? (r.met?'met':'unmet') : ''}"><span class="mark">${evaluate ? (r.met?'✓':'✗') : '•'}</span><span>${r.req.label}</span></li>`).join('');
  if(evaluate){
    const allMet = rows.every(r=>r.met);
    const extra = exerciseCables.length - rows.filter(r=>r.met).length;
    if(allMet){
      toast(extra>0 ? `¡Correcto! (hay ${extra} cable(s) extra sin relación con el ejercicio)` : '¡Ejercicio resuelto correctamente!');
    } else {
      toast('Todavía falta alguna conexión. Revisa la lista.');
    }
  }
}

document.getElementById('verifyBtn').addEventListener('click', ()=> renderChecklist(true));
document.getElementById('hintBtn').addEventListener('click', ()=>{
  const unmet = currentExercise.req.find(req => !exerciseCables.some(c=>pairEquals(req,c)));
  if(!unmet){ toast('Ya tienes todas las conexiones requeridas.'); return; }
  toast('Pista: '+unmet.label);
});
document.getElementById('resetExBtn').addEventListener('click', ()=>{
  exerciseCables = [];
  renderAll(); renderChecklist(false);
});
document.getElementById('backToListBtn').addEventListener('click', ()=>{
  currentExercise=null;
  document.getElementById('exerciseWorkCard').hidden=true;
  document.getElementById('exerciseListCard').hidden=false;
  setSectionsOpen('all');
});

// ---- Init ----
renderLegend();
buildAndRenderSections();
renderExList();
renderAll();
</script>
